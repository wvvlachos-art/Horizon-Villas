# Netlify deploy config.
# The live site is the static HTML at the repo root. No build step — Netlify
# publishes the root directory as-is.
[build]
  command = "echo 'Static site — no build step.'"
  publish = "."

# 301s from the pre-2026 site's URL structure (hotelwize-hosted), so pages
# Google indexed under the old paths keep their link equity. Source list is the
# old site's sitemap.xml, captured 2026-08-10. Greek (/el/) pages map to the
# same English targets — the redesign has no Greek version.
[[redirects]]
